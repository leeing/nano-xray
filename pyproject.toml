[project]
name = "nano-xray"
version = "2.0.0.dev0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S", "ARG", "C4"]

[tool.ruff.lint.per-file-ignores]
# deploy.py is the legacy single-file server bootstrap. These calls use fixed
# executables/HTTPS URLs, and the public listeners sit behind Caddy by design.
"deploy.py" = ["ARG001", "S104", "S310", "S603", "S607"]
"tests/*" = ["S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["deploy.py"]
